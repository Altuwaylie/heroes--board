<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة أسماء الأبطال</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(160deg, #fff3d6, #ffe0f0, #dff3ff);
    color: #333;
    padding: 12px;
    user-select: none;
  }

  .setup-screen {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .setup-card {
    background: #fff;
    border: 4px solid #4caf50;
    border-radius: 26px;
    padding: 24px;
    max-width: 600px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }

  .setup-card h2 { color: #2e7d32; margin-top: 0; }

  textarea {
    width: 100%;
    min-height: 170px;
    border: 3px solid #ffb703;
    border-radius: 18px;
    padding: 12px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    resize: vertical;
  }

  .hint { color: #7a5b8f; font-size: 14px; margin: 10px 0; }

  .checkbox-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 12px 0 16px;
    font-weight: bold;
    color: #555;
  }

  .checkbox-row input { width: 20px; height: 20px; accent-color: #4caf50; }

  header { text-align: center; margin-bottom: 12px; }

  h1 {
    margin: 0;
    font-size: clamp(22px, 5vw, 36px);
    color: #ff5fa2;
    text-shadow: 2px 2px 0 #fff;
  }

  .subtitle {
    font-size: clamp(13px, 3vw, 18px);
    color: #7a5b8f;
    margin-top: 4px;
  }

  .top-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 12px;
  }

  input, textarea {
    border: 3px solid #ffb703;
    border-radius: 18px;
    padding: 10px 14px;
    font-size: 16px;
    outline: none;
    background: #fff;
    font-family: inherit;
  }

  input { min-width: 180px; }

  button {
    border: none;
    border-radius: 18px;
    padding: 10px 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    color: #fff;
    transition: transform .15s;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
  }

  button:active { transform: scale(.95); }

  .add-btn { background: #4caf50; }
  .new-day-btn { background: #ff7043; }
  .clear-btn { background: #90a4ae; }
  .reimport-btn { background: #90a4ae; }
  .add-column-btn { background: #3f51b5; }
  .delete-student-btn { background: #e91e63; }
  .delete-student-btn.active { background: #b71c1c; animation: pulse 1s infinite; }
  .return-btn { background: #7e57c2; display: none; }
  .return-btn.show { display: block; animation: popIn .25s; }
  .cancel-btn { background: #78909c; }
  .start-btn { background: #4caf50; font-size: 18px; padding: 12px 24px; }

  .names-panel {
    background: #ffffffcc;
    border: 4px solid #4caf50;
    border-radius: 22px;
    padding: 12px;
    margin-bottom: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.08);
  }

  .names-title {
    font-weight: bold;
    color: #2e7d32;
    margin-bottom: 8px;
    text-align: center;
    font-size: clamp(16px, 3.5vw, 22px);
  }

  .names-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .name-chip {
    position: relative;
    background: #ffe082;
    border: 3px solid #ffca28;
    border-radius: 16px;
    padding: 8px 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: transform .15s;
  }

  .name-chip:active { transform: scale(.95); }

  .name-chip.selected {
    background: #b39ddb;
    border-color: #7e57c2;
    color: #fff;
  }

  .order-badge {
    position: absolute;
    top: -10px;
    right: -10px;
    background: #7e57c2;
    color: #fff;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .name-chip.delete-mode { animation: wiggle 1s infinite; }

  .delete-x {
    position: absolute;
    top: -10px;
    left: -10px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ef5350;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    animation: popIn .25s;
  }

  .import-box {
    display: none;
    background: #ffffffee;
    border: 3px dashed #90a4ae;
    border-radius: 20px;
    padding: 12px;
    margin-bottom: 14px;
  }

  .import-box.show { display: block; animation: popIn .3s; }

  .board-wrap {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 10px;
  }

  .board {
    display: flex;
    gap: 10px;
    width: max-content;
    min-width: 100%;
  }

  .column {
    position: relative;
    background: #ffffffd9;
    border-radius: 20px;
    padding: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 170px;
    flex-shrink: 0;
  }

  .column-title {
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    color: #fff;
    background: linear-gradient(90deg, #ff5fa2, #ff9800);
    border-radius: 14px;
    padding: 6px;
    cursor: pointer;
    transition: transform .15s;
  }

  .column-title:active { transform: scale(.95); }

  /* عند اختيار أسماء أو وضع نقل: العمود يومض بالبرتقالي */
  .column-title.active-mode {
    background: linear-gradient(90deg, #ff7043, #ff9800);
    animation: pulse 1s infinite;
  }

  .column-delete {
    position: absolute;
    top: -10px;
    left: -10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ef5350;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    z-index: 5;
    animation: popIn .25s;
  }

  .slot {
    min-height: 46px;
    border-radius: 14px;
    background: #f3f4f6;
    border: 2px dashed #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    padding: 4px;
    text-align: center;
    transition: all .25s;
  }

  .slot.selectable { cursor: pointer; }

  .slot.selectable:hover {
    border-color: #7e57c2;
    background: #ede7f6;
  }

  .slot.temp-slot {
    border: 3px solid #7e57c2;
    background: #ede7f6;
    animation: popIn .3s;
  }

  .slot.moving {
    border: 4px solid #ff7043;
    background: #fff3e0;
    color: #e65100;
    animation: movePulse .8s infinite;
  }

  .move-hint {
    display: block;
    font-size: 10px;
    font-weight: bold;
    color: #e65100;
  }

  .slot.filled {
    background: #e8f5e9;
    border: 3px solid #4caf50;
    color: #1b5e20;
    animation: popIn .35s;
  }

  .slot.no-star {
    background: #fffde7;
    border-color: #fbc02d;
    color: #5d4037;
  }

  .slot.struck {
    background: #ffebee;
    border: 3px solid #ef5350;
    color: #b71c1c;
    text-decoration: line-through;
  }

  .star {
    margin-inline-start: 4px;
    display: inline-block;
    animation: starSpin 1.6s infinite;
  }

  .star.removing { animation: starOut .45s forwards; }

  .error-x {
    margin-inline-start: 4px;
    color: #ef5350;
    font-weight: bold;
    animation: shakeX .5s;
  }

  .message {
    text-align: center;
    min-height: 26px;
    font-weight: bold;
    color: #6a4c93;
    margin-top: 10px;
  }

  @keyframes popIn {
    0% { transform: scale(.4); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @keyframes starSpin {
    0%,100% { transform: rotate(0) scale(1); }
    50% { transform: rotate(20deg) scale(1.25); }
  }

  @keyframes starOut {
    0% { transform: scale(1) rotate(0); opacity: 1; }
    100% { transform: scale(2.2) rotate(180deg); opacity: 0; }
  }

  @keyframes shakeX {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  @keyframes slotShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }

  .slot.struck { animation: slotShake .4s; }

  @keyframes movePulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 0 0 #ff704366; }
    50% { transform: scale(1.05); box-shadow: 0 0 0 8px #ff704300; }
  }

  @keyframes wiggle {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(-2deg); }
    75% { transform: rotate(2deg); }
  }

  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
</style>
</head>
<body>

<div class="setup-screen" id="setupScreen">
  <div class="setup-card">
    <h2>⭐ أدخل أسماء الأبطال ⭐</h2>
    <textarea id="setupTextarea" placeholder="الصق الأسماء هنا، كل اسم في سطر منفصل&#10;أو افصل بينها بفاصلة"></textarea>

    <div class="checkbox-row">
      <input type="checkbox" id="shortNamesCheckbox" checked>
      <label for="shortNamesCheckbox">تقصير الاسم</label>
    </div>

    <div class="hint">يظهر الاسم الأول فقط، وإذا تكرر يُضاف الثاني، وهكذا.</div>

    <button class="start-btn" onclick="startFromSetup()">✅ ابدأ اللوحة</button>
  </div>
</div>

<div id="mainScreen" style="display:none;">
  <header>
    <h1>⭐ لوحة أسماء الأبطال ⭐</h1>
    <div class="subtitle">اختر أسماء بالترتيب ثم اضغط رقم العمود، أو اضغط مطولًا على اسم لنقله</div>
  </header>

  <div class="top-bar">
    <input id="nameInput" placeholder="اكتب اسم بطل جديد هنا">
    <button class="add-btn" onclick="addName()">➕ إضافة اسم</button>
    <button class="add-column-btn" onclick="addColumn()">🏛️ إضافة عمود</button>
    <button class="new-day-btn" onclick="newDay()">🌅 بداية يوم جديد</button>
    <button id="returnBtn" class="return-btn" onclick="returnMovingToTop()">⬆️ إرجاع إلى الأعلى</button>
    <button id="deleteStudentBtn" class="delete-student-btn" onclick="toggleDeleteStudentMode()">🗑️ حذف طالب</button>
    <button class="clear-btn" onclick="clearAll()">🧹 مسح الكل</button>
    <button class="reimport-btn" onclick="toggleImportBox()">📋 إعادة إدخال الأسماء</button>
  </div>

  <div class="import-box" id="importBox">
    <textarea id="importTextarea" placeholder="الصق الأسماء هنا، كل اسم في سطر منفصل&#10;أو افصل بينها بفاصلة"></textarea>

    <div class="checkbox-row">
      <input type="checkbox" id="importShortNamesCheckbox" checked>
      <label for="importShortNamesCheckbox">تقصير الاسم</label>
    </div>

    <div style="display:flex; gap:8px; justify-content:center;">
      <button class="reimport-btn" onclick="importNames()">✅ حفظ الأسماء</button>
      <button class="cancel-btn" onclick="toggleImportBox()">إلغاء</button>
    </div>
  </div>

  <div class="names-panel">
    <div class="names-title">⭐ أسماء الأبطال ⭐</div>
    <div class="names-list" id="namesList"></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="message" id="message">اضغط على الأسماء بالترتيب، ثم اضغط على رقم العمود.</div>
</div>

<script>
const STORAGE_KEY = "kids_heroes_board_v19";

let state = {
  setupDone: false,
  names: [],
  columns: [],
  extraSlots: 0,
  selectedNameIds: [],
  movingNameId: null,
  deleteStudentMode: false
};

const setupScreen = document.getElementById("setupScreen");
const mainScreen = document.getElementById("mainScreen");
const setupTextarea = document.getElementById("setupTextarea");
const shortNamesCheckbox = document.getElementById("shortNamesCheckbox");
const board = document.getElementById("board");
const namesList = document.getElementById("namesList");
const message = document.getElementById("message");
const nameInput = document.getElementById("nameInput");
const deleteStudentBtn = document.getElementById("deleteStudentBtn");
const returnBtn = document.getElementById("returnBtn");
const importBox = document.getElementById("importBox");
const importTextarea = document.getElementById("importTextarea");
const importShortNamesCheckbox = document.getElementById("importShortNamesCheckbox");

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function load() {
  const saved = localStorage.getItem(STORAGE_KEY);

  if (saved) {
    try {
      state = JSON.parse(saved);
    } catch (e) {
      state = { setupDone: false, names: [], columns: [], extraSlots: 0, selectedNameIds: [], movingNameId: null, deleteStudentMode: false };
    }
  }

  updateScreens();
  render();
}

function updateScreens() {
  if (state.setupDone) {
    setupScreen.style.display = "none";
    mainScreen.style.display = "block";
  } else {
    setupScreen.style.display = "flex";
    mainScreen.style.display = "none";
  }
}

function parseNames(raw) {
  return raw.split(/\n|،|,/).map(n => n.trim()).filter(n => n.length > 0);
}

function shortenNames(namesArray) {
  const result = [];
  const used = {};

  namesArray.forEach(fullName => {
    const parts = fullName.split(/\s+/).filter(p => p.length > 0);
    if (parts.length === 0) return;

    let count = 1;
    let candidate = parts.slice(0, count).join(" ");

    while (used[candidate] && count < parts.length) {
      count++;
      candidate = parts.slice(0, count).join(" ");
    }

    used[candidate] = true;
    result.push(candidate);
  });

  return result;
}

function startFromSetup() {
  let namesArray = parseNames(setupTextarea.value);

  if (namesArray.length === 0) {
    alert("الصق أو اكتب الأسماء أولًا 🙂");
    return;
  }

  if (shortNamesCheckbox.checked) {
    namesArray = shortenNames(namesArray);
  }

  state.names = namesArray.map((text, i) => ({
    id: "name_" + Date.now() + "_" + i,
    text,
    hasStar: true
  }));

  state.columns = [];
  for (let c = 0; c < 6; c++) state.columns.push(createColumn());

  state.extraSlots = 0;
  state.setupDone = true;
  state.selectedNameIds = [];
  state.movingNameId = null;

  setupTextarea.value = "";
  save();
  updateScreens();
  render();
  showMessage("تم تجهيز اللوحة! اختر الأسماء بالترتيب ثم اضغط على رقم العمود.");
}

function createColumn() {
  return [null, null];
}

function getPermanentSlotCount() {
  return 2 + state.extraSlots;
}

function ensureColumns() {
  const count = getPermanentSlotCount();
  state.columns.forEach(column => {
    while (column.length < count) column.push(null);
  });
}

function showMessage(text) {
  message.textContent = text;
}

function addName() {
  const text = nameInput.value.trim();
  if (!text) {
    showMessage("اكتب اسمًا أولًا 🙂");
    return;
  }

  const id = Date.now() + "_" + Math.random().toString(36).slice(2, 7);
  state.names.push({ id, text, hasStar: true });
  nameInput.value = "";
  showMessage("تمت إضافة: " + text + " 🎉");
  save();
  render();
}

function toggleImportBox() {
  if (!importBox.classList.contains("show")) {
    if (!confirm("هل تريد إعادة إدخال الأسماء؟ سيتم استبدال الأسماء الحالية وإرجاع الجميع إلى الأعلى.")) return;
  }
  importBox.classList.toggle("show");
}

function importNames() {
  let namesArray = parseNames(importTextarea.value);

  if (namesArray.length === 0) {
    showMessage("الصق الأسماء أولًا 🙂");
    return;
  }

  if (importShortNamesCheckbox.checked) {
    namesArray = shortenNames(namesArray);
  }

  if (!confirm("سيتم استبدال كل الأسماء الحالية بـ " + namesArray.length + " اسمًا. هل تريد المتابعة؟")) return;

  state.names = namesArray.map((text, i) => ({
    id: "imported_" + Date.now() + "_" + i,
    text,
    hasStar: true
  }));

  state.columns = [];
  for (let c = 0; c < 6; c++) state.columns.push(createColumn());

  state.extraSlots = 0;
  state.selectedNameIds = [];
  state.movingNameId = null;
  importTextarea.value = "";
  importBox.classList.remove("show");

  showMessage("تم إدخال " + namesArray.length + " اسمًا.");
  save();
  render();
}

function toggleDeleteStudentMode() {
  state.deleteStudentMode = !state.deleteStudentMode;
  save();
  render();
  showMessage(state.deleteStudentMode ? "وضع حذف الطلاب مفعّل." : "تم إيقاف وضع حذف الطلاب.");
}

function deleteName(nameId, event) {
  event.stopPropagation();

  const name = state.names.find(n => n.id === nameId);
  if (!name) return;

  if (!confirm("هل تريد حذف " + name.text + "؟")) return;

  state.columns.forEach(column => {
    for (let r = 0; r < column.length; r++) {
      if (column[r] && column[r].nameId === nameId) column[r] = null;
    }
  });

  state.names = state.names.filter(n => n.id !== nameId);
  state.selectedNameIds = state.selectedNameIds.filter(id => id !== nameId);
  if (state.movingNameId === nameId) state.movingNameId = null;

  showMessage("تم حذف " + name.text + " 🧹");
  save();
  render();
}

function addColumn() {
  const count = getPermanentSlotCount();
  const newColumn = [];
  for (let r = 0; r < count; r++) newColumn.push(null);

  state.columns.push(newColumn);
  showMessage("تمت إضافة عمود جديد 🏛️");
  save();
  render();
}

function deleteLastColumn() {
  if (state.columns.length <= 1) {
    showMessage("لا يمكن حذف آخر عمود 😅");
    return;
  }

  if (!confirm("هل تريد حذف العمود الأخير؟")) return;

  state.columns.pop();
  showMessage("تم حذف العمود الأخير 🧹");
  save();
  render();
}

function toggleSelectName(id) {
  const index = state.selectedNameIds.indexOf(id);

  if (index !== -1) {
    state.selectedNameIds.splice(index, 1);
  } else {
    state.selectedNameIds.push(id);
  }

  save();
  render();

  if (state.selectedNameIds.length === 0) {
    showMessage("اضغط على الأسماء بالترتيب، ثم اضغط على رقم العمود.");
  } else if (state.selectedNameIds.length === 1) {
    showMessage("اخترت: " + getNameText(id) + " 👆 اضغط على خانة أو رقم عمود.");
  } else {
    showMessage("اخترت " + state.selectedNameIds.length + " أسماء بالترتيب. اضغط على رقم العمود.");
  }
}

function findNameLocation(nameId) {
  for (let c = 0; c < state.columns.length; c++) {
    for (let r = 0; r < state.columns[c].length; r++) {
      const slot = state.columns[c][r];
      if (slot && slot.nameId === nameId) return { c, r };
    }
  }
  return null;
}

function placeSelectedNamesInColumn(columnIndex) {
  if (state.movingNameId) {
    moveMovingToColumn(columnIndex);
    return;
  }

  if (state.selectedNameIds.length === 0) {
    showMessage("اختر اسمًا أو أكثر من الأعلى أولًا 👆");
    return;
  }

  const column = state.columns[columnIndex];
  let placed = 0;

  state.selectedNameIds.forEach(nameId => {
    const oldLocation = findNameLocation(nameId);
    if (oldLocation) state.columns[oldLocation.c][oldLocation.r] = null;

    let emptyIndex = column.findIndex(slot => slot === null);

    if (emptyIndex === -1) {
      state.extraSlots++;
      ensureColumns();
      emptyIndex = state.columns[columnIndex].findIndex(slot => slot === null);
    }

    if (emptyIndex !== -1) {
      state.columns[columnIndex][emptyIndex] = { nameId, struck: false };
      placed++;
    }
  });

  state.selectedNameIds = [];
  showMessage("تم وضع " + placed + " أسماء في العمود " + (columnIndex + 1) + " ⭐");
  save();
  render();
}

function placeSingleSelected(columnIndex, rowIndex, isTempSlot) {
  const nameId = state.selectedNameIds[0];
  const name = state.names.find(n => n.id === nameId);

  const oldLocation = findNameLocation(nameId);

  if (oldLocation && oldLocation.c === columnIndex && oldLocation.r === rowIndex) {
    state.selectedNameIds = [];
    showMessage("تم إلغاء اختيار " + name.text);
    save();
    render();
    return;
  }

  if (oldLocation) state.columns[oldLocation.c][oldLocation.r] = null;

  if (isTempSlot) {
    state.extraSlots++;
    ensureColumns();
  }

  state.columns[columnIndex][rowIndex] = { nameId, struck: false };
  state.selectedNameIds = [];

  showMessage("تم وضع " + name.text + " في العمود " + (columnIndex + 1) + " ⭐");
  save();
  render();
}

function startMoving(nameId) {
  state.movingNameId = nameId;
  save();
  render();

  const name = state.names.find(n => n.id === nameId);
  showMessage("👆 " + name.text + " جاهز للنقل. اضغط على خانة أو رقم عمود.");
}

function returnMovingToTop() {
  if (!state.movingNameId) return;

  const name = state.names.find(n => n.id === state.movingNameId);

  state.columns.forEach(column => {
    for (let r = 0; r < column.length; r++) {
      if (column[r] && column[r].nameId === state.movingNameId) column[r] = null;
    }
  });

  state.movingNameId = null;
  showMessage("تم إرجاع " + name.text + " إلى قائمة الأبطال ⬆️");
  save();
  render();
}

function moveMovingToColumn(columnIndex) {
  const nameId = state.movingNameId;
  const name = state.names.find(n => n.id === nameId);

  const oldLocation = findNameLocation(nameId);

  if (oldLocation && oldLocation.c === columnIndex) {
    showMessage(name.text + " موجود بالفعل في هذا العمود.");
    return;
  }

  if (oldLocation) state.columns[oldLocation.c][oldLocation.r] = null;

  let emptyIndex = state.columns[columnIndex].findIndex(slot => slot === null);

  if (emptyIndex === -1) {
    state.extraSlots++;
    ensureColumns();
    emptyIndex = state.columns[columnIndex].findIndex(slot => slot === null);
  }

  state.columns[columnIndex][emptyIndex] = { nameId, struck: false };
  state.movingNameId = null;

  showMessage("تم نقل " + name.text + " إلى العمود " + (columnIndex + 1) + " 🎉");
  save();
  render();
}

function moveMovingToSlot(columnIndex, rowIndex, isTempSlot) {
  const nameId = state.movingNameId;
  const name = state.names.find(n => n.id === nameId);

  const oldLocation = findNameLocation(nameId);
  const targetSlot = isTempSlot ? null : state.columns[columnIndex][rowIndex];

  if (oldLocation && oldLocation.c === columnIndex && oldLocation.r === rowIndex) {
    state.movingNameId = null;
    showMessage("تم إلغاء نقل " + name.text);
    save();
    render();
    return;
  }

  if (oldLocation) state.columns[oldLocation.c][oldLocation.r] = null;

  if (targetSlot) {
    const otherNameId = targetSlot.nameId;
    const otherStruck = targetSlot.struck;

    if (oldLocation) {
      state.columns[oldLocation.c][oldLocation.r] = {
        nameId: otherNameId,
        struck: otherStruck
      };
    }
  }

  if (isTempSlot) {
    state.extraSlots++;
    ensureColumns();
  }

  state.columns[columnIndex][rowIndex] = { nameId, struck: false };
  state.movingNameId = null;

  showMessage("تم نقل " + name.text + " بنجاح 🎉");
  save();
  render();
}

function cycleSlotState(columnIndex, slotIndex, slotElement) {
  const slot = state.columns[columnIndex][slotIndex];
  if (!slot) return;

  const name = state.names.find(n => n.id === slot.nameId);
  if (!name) return;

  if (state.movingNameId) {
    if (state.movingNameId === name.id) {
      state.movingNameId = null;
      showMessage("تم إلغاء وضع النقل.");
      save();
      render();
    }
    return;
  }

  if (state.selectedNameIds.length > 0) {
    placeSingleSelected(columnIndex, slotIndex, false);
    return;
  }

  if (name.hasStar) {
    name.hasStar = false;
    slot.struck = false;

    const star = slotElement.querySelector(".star");
    if (star) {
      star.classList.add("removing");
      setTimeout(() => { save(); render(); }, 430);
    } else {
      save();
      render();
    }

    showMessage("تم إزالة النجمة من " + name.text + " ⭐");
    return;
  }

  if (!slot.struck) {
    slot.struck = true;
    showMessage(name.text + " تم شطبه ❌");
    save();
    render();
    return;
  }

  slot.struck = false;
  showMessage(name.text + " عاد بدون نجمة 🌟");
  save();
  render();
}

function getNameText(nameId) {
  const name = state.names.find(n => n.id === nameId);
  return name ? name.text : "";
}

function newDay() {
  state.names.forEach(name => name.hasStar = true);

  state.columns.forEach(column => {
    column.forEach(slot => {
      if (slot) slot.struck = false;
    });
  });

  state.selectedNameIds = [];
  state.movingNameId = null;
  showMessage("بداية يوم جديد! عادت النجوم 🌟");
  save();
  render();
}

function clearAll() {
  if (!confirm("هل تريد إرجاع كل الأسماء إلى الأعلى وفراغ الأعمدة؟")) return;

  state.columns.forEach(column => {
    for (let r = 0; r < column.length; r++) column[r] = null;
  });

  state.selectedNameIds = [];
  state.movingNameId = null;
  showMessage("تم إرجاع كل الأبطال إلى الأعلى 🧹");
  save();
  render();
}

function attachSlotEvents(slot, columnIndex, rowIndex, isTempSlot, nameId) {
  let pressTimer = null;
  let pressed = false;

  slot.addEventListener("pointerdown", function () {
    if (!nameId) return;

    pressed = true;
    pressTimer = setTimeout(() => {
      if (pressed) startMoving(nameId);
    }, 500);
  });

  slot.addEventListener("pointerup", function () {
    clearTimeout(pressTimer);

    if (!pressed) return;
    pressed = false;

    if (state.movingNameId) {
      if (nameId) {
        moveMovingToSlot(columnIndex, rowIndex, false);
      } else {
        moveMovingToSlot(columnIndex, rowIndex, isTempSlot);
      }
      return;
    }

    if (state.selectedNameIds.length > 0) {
      if (!nameId) {
        if (state.selectedNameIds.length === 1) {
          placeSingleSelected(columnIndex, rowIndex, isTempSlot);
        }
      }
      return;
    }

    if (nameId) {
      cycleSlotState(columnIndex, rowIndex, slot);
    }
  });

  slot.addEventListener("pointercancel", function () {
    clearTimeout(pressTimer);
    pressed = false;
  });

  slot.addEventListener("click", function (event) {
    event.stopPropagation();
  });
}

function render() {
  updateScreens();

  if (!state.setupDone) return;

  deleteStudentBtn.classList.toggle("active", state.deleteStudentMode);
  returnBtn.classList.toggle("show", state.movingNameId !== null);

  ensureColumns();

  namesList.innerHTML = "";

  const availableNames = state.names.filter(name => findNameLocation(name.id) === null);

  if (availableNames.length === 0) {
    const empty = document.createElement("div");
    empty.style.color = "#90a4ae";
    empty.style.fontWeight = "bold";
    empty.textContent = "كل الأبطال في الأعمدة الآن 🎉";
    namesList.appendChild(empty);
  }

  availableNames.forEach(name => {
    const order = state.selectedNameIds.indexOf(name.id);

    const chip = document.createElement("div");
    chip.className = "name-chip" +
      (order !== -1 ? " selected" : "") +
      (state.deleteStudentMode ? " delete-mode" : "");

    chip.textContent = name.text;

    if (order !== -1) {
      const badge = document.createElement("div");
      badge.className = "order-badge";
      badge.textContent = order + 1;
      chip.appendChild(badge);
    }

    if (state.deleteStudentMode) {
      const x = document.createElement("div");
      x.className = "delete-x";
      x.textContent = "✕";
      x.addEventListener("click", (event) => deleteName(name.id, event));
      chip.appendChild(x);
    }

    chip.addEventListener("click", () => toggleSelectName(name.id));
    namesList.appendChild(chip);
  });

  board.innerHTML = "";

  const lastColumnIndex = state.columns.length - 1;
  const hasSelection = state.selectedNameIds.length > 0;
  const permanentCount = getPermanentSlotCount();
  const totalSlots = hasSelection ? permanentCount + 1 : permanentCount;

  state.columns.forEach((column, c) => {
    const columnDiv = document.createElement("div");
    columnDiv.className = "column";
    columnDiv.dataset.column = c;

    const title = document.createElement("div");
    title.className = "column-title" +
      ((hasSelection || state.movingNameId) ? " active-mode" : "");

    title.textContent = state.movingNameId
      ? "عمود " + (c + 1) + " 👆"
      : "عمود " + (c + 1);

    title.addEventListener("click", function (event) {
      event.stopPropagation();
      placeSelectedNamesInColumn(c);
    });

    columnDiv.appendChild(title);

    if (c === lastColumnIndex) {
      const deleteBtn = document.createElement("div");
      deleteBtn.className = "column-delete";
      deleteBtn.textContent = "✕";
      deleteBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        deleteLastColumn();
      });
      columnDiv.appendChild(deleteBtn);
    }

    for (let r = 0; r < totalSlots; r++) {
      const isTempSlot = hasSelection && r === permanentCount;
      const slotData = isTempSlot ? null : (column[r] || null);

      const slot = document.createElement("div");
      slot.className = "slot";
      slot.dataset.column = c;
      slot.dataset.row = r;

      if (slotData) {
        const name = state.names.find(n => n.id === slotData.nameId);

        slot.classList.add("filled", "selectable");

        if (state.movingNameId === slotData.nameId) {
          slot.classList.add("moving");
          slot.innerHTML = name.text + '<span class="move-hint">👆 انقلني</span>';
        } else if (slotData.struck) {
          slot.classList.add("struck");
          slot.innerHTML = name.text + '<span class="error-x">❌</span>';
        } else if (name.hasStar) {
          slot.innerHTML = name.text + '<span class="star">⭐</span>';
        } else {
          slot.classList.add("no-star");
          slot.textContent = name.text;
        }

        attachSlotEvents(slot, c, r, false, slotData.nameId);
      } else {
        slot.classList.add("selectable");
        slot.textContent = "•";

        if (isTempSlot) slot.classList.add("temp-slot");

        attachSlotEvents(slot, c, r, isTempSlot, null);
      }

      columnDiv.appendChild(slot);
    }

    board.appendChild(columnDiv);
  });
}

nameInput.addEventListener("keydown", function (event) {
  if (event.key === "Enter") addName();
});

window.addEventListener("load", load);
</script>
