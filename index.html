<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة أسماء الأبطال</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(160deg, #fff3d6, #ffe0f0, #dff3ff);
    color: #333;
    padding: 12px;
    user-select: none;
  }

  .setup-screen {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .setup-card {
    background: #fff;
    border: 4px solid #26a69a;
    border-radius: 26px;
    padding: 30px 24px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }

  .setup-card h2 { color: #00695c; margin-top: 0; }

  input {
    width: 100%;
    border: 3px solid #26a69a;
    border-radius: 18px;
    padding: 14px;
    font-size: 18px;
    font-family: inherit;
    outline: none;
    margin-bottom: 16px;
    text-align: center;
  }

  header { text-align: center; margin-bottom: 12px; }

  h1 {
    margin: 0;
    font-size: clamp(22px, 5vw, 36px);
    color: #ff5fa2;
    text-shadow: 2px 2px 0 #fff;
  }

  .subtitle {
    font-size: clamp(13px, 3vw, 18px);
    color: #7a5b8f;
    margin-top: 4px;
  }

  .groups-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    background: #ffffffcc;
    border-radius: 20px;
    padding: 10px;
    margin-bottom: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,.08);
  }

  .group-chip {
    position: relative;
    background: #26a69a;
    border: 3px solid #26a69a;
    color: #fff;
    border-radius: 16px;
    padding: 8px 14px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: transform .15s;
  }

  .group-chip:active { transform: scale(.95); }

  .group-chip.active {
    background: #ffffff;
    border-color: #26a69a;
    color: #00695c;
  }

  .group-chip.reorder-mode {
    border-color: #ff7043;
    background: #fff3e0;
    color: #e65100;
    animation: movePulse .8s infinite;
  }

  .group-chip .chip-actions {
    position: absolute;
    top: -16px;
    left: -8px;
    display: flex;
    gap: 4px;
    z-index: 10;
  }

  .chip-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ffb703;
    color: #fff;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,.2);
  }

  .chip-btn.delete { background: #ef5350; }

  .top-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 12px;
  }

  .top-bar input { width: auto; min-width: 180px; margin: 0; }

  button {
    border: none;
    border-radius: 18px;
    padding: 10px 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    color: #fff;
    transition: transform .15s;
    box-shadow: 0 4px 0 rgba(0,0,0,.15);
    touch-action: manipulation;
  }

  button:active { transform: scale(.95); }

  .add-btn { background: #4caf50; }
  .new-day-btn { background: #ff7043; }
  .reorder-names-btn { background: #7e57c2; }
  .reimport-btn { background: #90a4ae; }
  .add-column-btn { background: #3f51b5; }
  .add-group-btn { background: #26a69a; }
  .delete-student-btn { background: #e91e63; }
  .delete-student-btn.active { background: #b71c1c; animation: pulse 1s infinite; }
  .return-btn { background: #7e57c2; display: none; }
  .return-btn.show { display: block; animation: popIn .25s; }
  .cancel-btn { background: #78909c; }
  .start-btn { background: #26a69a; font-size: 18px; padding: 12px 24px; }

  .names-panel {
    background: #ffffffcc;
    border: 4px solid #26a69a;
    border-radius: 22px;
    padding: 12px;
    margin-bottom: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,.08);
  }

  .names-title {
    font-weight: bold;
    color: #00695c;
    margin-bottom: 8px;
    text-align: center;
    font-size: clamp(16px, 3.5vw, 22px);
  }

  .names-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .name-chip {
    position: relative;
    background: #ffe082;
    border: 3px solid #ffca28;
    border-radius: 16px;
    padding: 8px 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: transform .15s;
  }

  .name-chip:active { transform: scale(.95); }

  .name-chip.selected {
    background: #b39ddb;
    border-color: #7e57c2;
    color: #fff;
  }

  .order-badge {
    position: absolute;
    top: -10px;
    right: -10px;
    background: #7e57c2;
    color: #fff;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .name-chip.delete-mode { animation: wiggle 1s infinite; }

  .delete-x {
    position: absolute;
    top: -10px;
    left: -10px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ef5350;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    animation: popIn .25s;
  }

  .import-box {
    display: none;
    background: #ffffffee;
    border: 3px dashed #90a4ae;
    border-radius: 20px;
    padding: 12px;
    margin-bottom: 14px;
  }

  .import-box.show { display: block; animation: popIn .3s; }

  .board-wrap {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 10px;
  }

  .board {
    display: flex;
    gap: 10px;
    width: max-content;
    min-width: 100%;
  }

  .column {
    position: relative;
    background: #ffffffd9;
    border-radius: 20px;
    padding: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 170px;
    flex-shrink: 0;
  }

  .column-title {
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    color: #fff;
    background: linear-gradient(90deg, #26a69a, #4db6ac);
    border-radius: 14px;
    padding: 6px;
    cursor: pointer;
    transition: transform .15s;
  }

  .column-title:active { transform: scale(.95); }

  .column-title.active-mode {
    background: linear-gradient(90deg, #ff7043, #ff9800);
    animation: pulse 1s infinite;
  }

  .column-delete {
    position: absolute;
    top: -10px;
    left: -10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ef5350;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    z-index: 5;
    animation: popIn .25s;
  }

  .slot {
    min-height: 46px;
    border-radius: 14px;
    background: #f3f4f6;
    border: 2px dashed #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    padding: 4px;
    text-align: center;
    transition: all .25s;
  }

  .slot.selectable { cursor: pointer; }

  .slot.temp-slot {
    border: 3px solid #7e57c2;
    background: #ede7f6;
    animation: popIn .3s;
  }

  .slot.moving {
    border: 4px solid #ff7043;
    background: #fff3e0;
    color: #e65100;
    animation: movePulse .8s infinite;
  }

  .move-hint {
    display: block;
    font-size: 10px;
    font-weight: bold;
    color: #e65100;
  }

  .slot.filled {
    background: #e0f2f1;
    border: 3px solid #26a69a;
    color: #00695c;
    animation: popIn .35s;
  }

  .slot.no-star {
    background: #fffde7;
    border-color: #fbc02d;
    color: #5d4037;
  }

  .slot.struck {
    background: #ffebee;
    border: 3px solid #ef5350;
    color: #b71c1c;
    text-decoration: line-through;
  }

  .star {
    margin-inline-start: 4px;
    display: inline-block;
    animation: starSpin 1.6s infinite;
  }

  .star.removing { animation: starOut .45s forwards; }

  .error-x {
    margin-inline-start: 4px;
    color: #ef5350;
    font-weight: bold;
    animation: shakeX .5s;
  }

  .message {
    text-align: center;
    min-height: 26px;
    font-weight: bold;
    color: #00695c;
    margin-top: 10px;
  }

  @keyframes popIn {
    0% { transform: scale(.4); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes starSpin {
    0%,100% { transform: rotate(0) scale(1); }
    50% { transform: rotate(20deg) scale(1.25); }
  }

  @keyframes starOut {
    0% { transform: scale(1) rotate(0); opacity: 1; }
    100% { transform: scale(2.2) rotate(180deg); opacity: 0; }
  }

  @keyframes shakeX {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  @keyframes slotShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }

  .slot.struck { animation: slotShake .4s; }

  @keyframes movePulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 0 0 #ff704366; }
    50% { transform: scale(1.05); box-shadow: 0 0 0 8px #ff704300; }
  }

  @keyframes wiggle {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(-2deg); }
    75% { transform: rotate(2deg); }
  }

  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
</style>
</head>
<body>

<div class="setup-screen" id="setupScreen">
  <div class="setup-card">
    <h2>⭐ أدخل اسم الفصل ⭐</h2>
    <input type="text" id="classNameInput" placeholder="مثال: الصف الأول / فصل ٢">
    <button type="button" id="startBtn" class="start-btn">✅ ابدأ</button>
  </div>
</div>

<div id="mainScreen" style="display:none;">
  <header>
    <h1>⭐ لوحة أسماء الأبطال ⭐</h1>
    <div class="subtitle">اختر أسماء بالترتيب ثم اضغط رقم العمود، أو اضغط مطولًا على اسم لنقله</div>
  </header>

  <div class="groups-bar">
    <div class="names-list" id="groupsList"></div>
    <button class="add-group-btn" onclick="createNewClass()">➕ فصل جديد</button>
  </div>

  <div class="top-bar">
    <input id="nameInput" placeholder="اكتب اسم الطالب هنا">
    <button class="add-btn" onclick="addName()">➕ إضافة اسم</button>
    <button class="add-column-btn" onclick="addColumn()">🏛️ إضافة عمود</button>
    <button class="new-day-btn" onclick="newDay()">🌅 بداية يوم جديد</button>
    <button id="returnBtn" class="return-btn" onclick="returnMovingToTop()">⬆️ إرجاع إلى الأعلى</button>
    <button id="deleteStudentBtn" class="delete-student-btn" onclick="toggleDeleteStudentMode()">🗑️ حذف طالب</button>
    <button class="reorder-names-btn" onclick="resetAllNames()">🔄 إعادة ترتيب الأسماء</button>
    <button class="reimport-btn" onclick="toggleImportBox()">📋 إعادة إدخال الأسماء دفعة واحدة</button>
  </div>

  <div class="import-box" id="importBox">
    <textarea id="importTextarea" placeholder="الصق الأسماء هنا، كل اسم في سطر منفصل&#10;أو افصل بينها بفاصلة"></textarea>
    <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
      <button class="reimport-btn" onclick="importNames(false)">🔄 استبدال الأسماء</button>
      <button class="add-btn" onclick="importNames(true)">➕ إضافة دفعة واحدة</button>
      <button class="cancel-btn" onclick="toggleImportBox()">إلغاء</button>
    </div>
  </div>

  <div class="names-panel">
    <div class="names-title" id="groupTitle">⭐ أسماء الأبطال ⭐</div>
    <div class="names-list" id="namesList"></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="message" id="message">اضغط على الأسماء بالترتيب، ثم اضغط على رقم العمود.</div>
</div>

<script>
const STORAGE_KEY = "kids_heroes_classes_v7";

let state = {
  classes: [],
  currentClassId: null,
  reorderClassId: null,
  classActionsId: null
};

const setupScreen = document.getElementById("setupScreen");
const mainScreen = document.getElementById("mainScreen");
const classNameInput = document.getElementById("classNameInput");
const startBtn = document.getElementById("startBtn");
const groupsList = document.getElementById("groupsList");
const groupTitle = document.getElementById("groupTitle");
const board = document.getElementById("board");
const namesList = document.getElementById("namesList");
const message = document.getElementById("message");
const nameInput = document.getElementById("nameInput");
const deleteStudentBtn = document.getElementById("deleteStudentBtn");
const returnBtn = document.getElementById("returnBtn");
const importBox = document.getElementById("importBox");
const importTextarea = document.getElementById("importTextarea");

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function load() {
  const saved = localStorage.getItem(STORAGE_KEY);

  if (saved) {
    try {
      state = JSON.parse(saved);
    } catch (e) {
      state = { classes: [], currentClassId: null, reorderClassId: null, classActionsId: null };
    }
  }

  updateScreens();
  render();
}

function getCurrentClass() {
  return state.classes.find(c => c.id === state.currentClassId) || null;
}

function updateScreens() {
  const cls = getCurrentClass();

  if (cls) {
    setupScreen.style.display = "none";
    mainScreen.style.display = "block";
    groupTitle.textContent = "⭐ أبطال " + cls.name + " ⭐";
  } else {
    setupScreen.style.display = "flex";
    mainScreen.style.display = "none";
  }
}

function parseNames(raw) {
  return raw.split(/\n|،|,/).map(n => n.trim()).filter(n => n.length > 0);
}

function createColumn() {
  return [null, null];
}

function buildClass(name) {
  const columns = [];
  for (let c = 0; c < 6; c++) columns.push(createColumn());

  return {
    id: "class_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    name,
    names: [],
    columns,
    extraSlots: 0,
    selectedNameIds: [],
    movingNameId: null,
    deleteStudentMode: false
  };
}

function startFromSetup() {
  const className = classNameInput.value.trim();

  if (!className) {
    alert("اكتب اسم الفصل أولًا 🙂");
    return;
  }

  const cls = buildClass(className);
  state.classes.push(cls);
  state.currentClassId = cls.id;

  classNameInput.value = "";
  save();
  updateScreens();
  render();

  showMessage("تم إنشاء فصل: " + className + " 🎉 أضف أسماء الطلاب الآن.");
}

function createNewClass() {
  const className = prompt("اكتب اسم الفصل الجديد:");

  if (!className || !className.trim()) {
    showMessage("تم إلغاء إنشاء الفصل.");
    return;
  }

  const cls = buildClass(className.trim());
  state.classes.push(cls);
  state.currentClassId = cls.id;

  save();
  updateScreens();
  render();
  showMessage("تم إنشاء فصل: " + cls.name + " 🎉");
}

function switchClass(classId) {
  if (state.reorderClassId && state.reorderClassId !== classId) {
    const fromIndex = state.classes.findIndex(c => c.id === state.reorderClassId);
    const toIndex = state.classes.findIndex(c => c.id === classId);

    const temp = state.classes[fromIndex];
    state.classes[fromIndex] = state.classes[toIndex];
    state.classes[toIndex] = temp;

    state.reorderClassId = null;
    state.classActionsId = null;
    save();
    render();
    showMessage("تم تبديل مكان الفصلين 🔄");
    return;
  }

  if (state.reorderClassId === classId) {
    state.reorderClassId = null;
    state.classActionsId = null;
    save();
    render();
    showMessage("تم إلغاء إعادة الترتيب.");
    return;
  }

  state.currentClassId = classId;
  state.classActionsId = null;
  save();
  updateScreens();
  render();
  showMessage("أنت الآن في فصل: " + getCurrentClass().name);
}

function startClassActions(classId) {
  state.classActionsId = classId;
  save();
  render();
  showMessage("اختر ✏️ تعديل، ⇄ تبديل، أو 🗑️ حذف.");
}

function renameClass(classId, event) {
  event.stopPropagation();

  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;

  const newName = prompt("اكتب الاسم الجديد للفصل:", cls.name);

  if (newName && newName.trim()) {
    cls.name = newName.trim();
    state.classActionsId = null;
    save();
    render();
    showMessage("تم تعديل اسم الفصل ✏️");
  }
}

function startReorder(classId, event) {
  event.stopPropagation();

  state.reorderClassId = classId;
  state.classActionsId = null;
  save();
  render();
  showMessage("👆 اختر فصلًا آخر لتبديل مكانه.");
}

function deleteClass(classId, event) {
  event.stopPropagation();

  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;

  if (state.classes.length <= 1) {
    showMessage("لا يمكن حذف الفصل الأخير 😅");
    return;
  }

  if (!confirm("هل تريد حذف فصل: " + cls.name + " نهائيًا؟")) {
    state.classActionsId = null;
    save();
    render();
    return;
  }

  state.classes = state.classes.filter(c => c.id !== classId);

  if (state.currentClassId === classId) {
    state.currentClassId = state.classes[0].id;
  }

  state.classActionsId = null;
  save();
  updateScreens();
  render();
  showMessage("تم حذف الفصل.");
}

function showMessage(text) {
  message.textContent = text;
}

function resetAllNames() {
  const cls = getCurrentClass();
  if (!cls) return;

  if (cls.names.length === 0) {
    showMessage("لا توجد أسماء لإعادتها.");
    return;
  }

  if (confirm("هل تريد إعادة ترتيب الأسماء؟ سيتم إرجاع جميع الأسماء إلى الأعلى.")) {
    cls.columns.forEach(column => {
      for (let r = 0; r < column.length; r++) column[r] = null;
    });

    cls.selectedNameIds = [];
    cls.movingNameId = null;

    showMessage("تم إرجاع جميع الأسماء إلى الأعلى 🔄 يمكنك توزيعها من جديد.");
    save();
    render();
  } else {
    showMessage("تم إلغاء إعادة الترتيب.");
  }
}

function addName() {
  const cls = getCurrentClass();
  if (!cls) return;

  const text = nameInput.value.trim();
  if (!text) {
    showMessage("اكتب اسم الطالب أولًا 🙂");
    return;
  }

  const id = Date.now() + "_" + Math.random().toString(36).slice(2, 7);
  cls.names.push({ id, text, hasStar: true });
  nameInput.value = "";

  showMessage("تمت إضافة: " + getDisplayName(cls, id) + " 🎉");
  save();
  render();
}

function toggleImportBox() {
  if (!importBox.classList.contains("show")) {
    if (!confirm("هل تريد إعادة إدخال الأسماء دفعة واحدة؟ يمكنك الاستبدال أو الإضافة.")) return;
  }
  importBox.classList.toggle("show");
}

function importNames(appendMode) {
  const cls = getCurrentClass();
  if (!cls) return;

  const namesArray = parseNames(importTextarea.value);

  if (namesArray.length === 0) {
    showMessage("الصق الأسماء أولًا 🙂");
    return;
  }

  if (appendMode) {
    if (!confirm("سيتم إضافة " + namesArray.length + " اسمًا إلى الأسماء الحالية. هل تريد المتابعة؟")) return;

    namesArray.forEach(text => {
      const id = Date.now() + "_" + Math.random().toString(36).slice(2, 7);
      cls.names.push({ id, text, hasStar: true });
    });

    showMessage("تمت إضافة " + namesArray.length + " اسمًا دفعة واحدة ➕");
  } else {
    if (!confirm("سيتم استبدال أسماء فصل: " + cls.name + " بـ " + namesArray.length + " اسمًا. هل تريد المتابعة؟")) return;

    cls.names = namesArray.map((text, i) => ({
      id: "imported_" + Date.now() + "_" + i,
      text,
      hasStar: true
    }));

    cls.columns = [];
    for (let c = 0; c < 6; c++) cls.columns.push(createColumn());

    cls.extraSlots = 0;
    cls.selectedNameIds = [];
    cls.movingNameId = null;

    showMessage("تم استبدال الأسماء بنجاح 🔄");
  }

  importTextarea.value = "";
  importBox.classList.remove("show");
  save();
  render();
}

function toggleDeleteStudentMode() {
  const cls = getCurrentClass();
  if (!cls) return;

  cls.deleteStudentMode = !cls.deleteStudentMode;
  save();
  render();
  showMessage(cls.deleteStudentMode ? "وضع حذف الطلاب مفعّل." : "تم إيقاف وضع حذف الطلاب.");
}

function deleteName(nameId, event) {
  event.stopPropagation();

  const cls = getCurrentClass();
  if (!cls) return;

  const name = cls.names.find(n => n.id === nameId);
  if (!name) return;

  if (!confirm("هل تريد حذف " + name.text + "؟")) return;

  cls.columns.forEach(column => {
    for (let r = 0; r < column.length; r++) {
      if (column[r] && column[r].nameId === nameId) column[r] = null;
    }
  });

  cls.names = cls.names.filter(n => n.id !== nameId);
  cls.selectedNameIds = cls.selectedNameIds.filter(id => id !== nameId);
  if (cls.movingNameId === nameId) cls.movingNameId = null;

  showMessage("تم حذف " + name.text + " 🧹");
  save();
  render();
}

function addColumn() {
  const cls = getCurrentClass();
  if (!cls) return;

  const count = 2 + cls.extraSlots;
  const newColumn = [];
  for (let r = 0; r < count; r++) newColumn.push(null);

  cls.columns.push(newColumn);
  showMessage("تمت إضافة عمود جديد 🏛️");
  save();
  render();
}

function deleteLastColumn() {
  const cls = getCurrentClass();
  if (!cls) return;

  if (cls.columns.length <= 1) {
    showMessage("لا يمكن حذف آخر عمود 😅");
    return;
  }

  if (!confirm("هل تريد حذف العمود الأخير؟")) return;

  cls.columns.pop();
  showMessage("تم حذف العمود الأخير 🧹");
  save();
  render();
}

function toggleSelectName(id) {
  const cls = getCurrentClass();
  if (!cls) return;

  const index = cls.selectedNameIds.indexOf(id);

  if (index !== -1) {
    cls.selectedNameIds.splice(index, 1);
  } else {
    cls.selectedNameIds.push(id);
  }

  save();
  render();

  if (cls.selectedNameIds.length === 0) {
    showMessage("اضغط على الأسماء بالترتيب، ثم اضغط على رقم العمود.");
  } else if (cls.selectedNameIds.length === 1) {
    showMessage("اخترت: " + getDisplayName(cls, id) + " 👆 اضغط على خانة أو رقم عمود.");
  } else {
    showMessage("اخترت " + cls.selectedNameIds.length + " أسماء بالترتيب. اضغط على رقم العمود.");
  }
}

function findNameLocation(nameId) {
  const cls = getCurrentClass();
  if (!cls) return null;

  for (let c = 0; c < cls.columns.length; c++) {
    for (let r = 0; r < cls.columns[c].length; r++) {
      const slot = cls.columns[c][r];
      if (slot && slot.nameId === nameId) return { c, r };
    }
  }
  return null;
}

function placeSelectedNamesInColumn(columnIndex) {
  const cls = getCurrentClass();
  if (!cls) return;

  if (cls.movingNameId) {
    moveMovingToColumn(columnIndex);
    return;
  }

  if (cls.selectedNameIds.length === 0) {
    showMessage("اختر اسمًا أو أكثر من الأعلى أولًا 👆");
    return;
  }

  const column = cls.columns[columnIndex];
  let placed = 0;

  cls.selectedNameIds.forEach(nameId => {
    const oldLocation = findNameLocation(nameId);
    if (oldLocation) cls.columns[oldLocation.c][oldLocation.r] = null;

    let emptyIndex = column.findIndex(slot => slot === null);

    if (emptyIndex === -1) {
      cls.extraSlots++;
      const count = 2 + cls.extraSlots;

      cls.columns.forEach(col => {
        while (col.length < count) col.push(null);
      });

      emptyIndex = cls.columns[columnIndex].findIndex(slot => slot === null);
    }

    if (emptyIndex !== -1) {
      cls.columns[columnIndex][emptyIndex] = { nameId, struck: false };
      placed++;
    }
  });

  cls.selectedNameIds = [];
  showMessage("تم وضع " + placed + " أسماء في العمود " + (columnIndex + 1) + " ⭐");
  save();
  render();
}

function placeSingleSelected(columnIndex, rowIndex, isTempSlot) {
  const cls = getCurrentClass();
  if (!cls) return;

  const nameId = cls.selectedNameIds[0];
  const name = cls.names.find(n => n.id === nameId);

  const oldLocation = findNameLocation(nameId);

  if (oldLocation && oldLocation.c === columnIndex && oldLocation.r === rowIndex) {
    cls.selectedNameIds = [];
    showMessage("تم إلغاء اختيار " + name.text);
    save();
    render();
    return;
  }

  if (oldLocation) cls.columns[oldLocation.c][oldLocation.r] = null;

  if (isTempSlot) {
    cls.extraSlots++;
    const count = 2 + cls.extraSlots;

    cls.columns.forEach(col => {
      while (col.length < count) col.push(null);
    });
  }

  cls.columns[columnIndex][rowIndex] = { nameId, struck: false };
  cls.selectedNameIds = [];

  showMessage("تم وضع " + name.text + " في العمود " + (columnIndex + 1) + " ⭐");
  save();
  render();
}

function startMoving(nameId) {
  const cls = getCurrentClass();
  if (!cls) return;

  cls.movingNameId = nameId;
  save();
  render();

  showMessage("👆 " + getDisplayName(cls, nameId) + " جاهز للنقل. اضغط على خانة أو رقم عمود.");
}

function returnMovingToTop() {
  const cls = getCurrentClass();
  if (!cls || !cls.movingNameId) return;

  const name = cls.names.find(n => n.id === cls.movingNameId);

  cls.columns.forEach(column => {
    for (let r = 0; r < column.length; r++) {
      if (column[r] && column[r].nameId === cls.movingNameId) column[r] = null;
    }
  });

  cls.movingNameId = null;
  showMessage("تم إرجاع " + name.text + " إلى قائمة الأبطال ⬆️");
  save();
  render();
}

function moveMovingToColumn(columnIndex) {
  const cls = getCurrentClass();
  if (!cls || !cls.movingNameId) return;

  const nameId = cls.movingNameId;
  const name = cls.names.find(n => n.id === nameId);

  const oldLocation = findNameLocation(nameId);

  if (oldLocation && oldLocation.c === columnIndex) {
    showMessage(name.text + " موجود بالفعل في هذا العمود.");
    return;
  }

  if (oldLocation) cls.columns[oldLocation.c][oldLocation.r] = null;

  let emptyIndex = cls.columns[columnIndex].findIndex(slot => slot === null);

  if (emptyIndex === -1) {
    cls.extraSlots++;
    const count = 2 + cls.extraSlots;

    cls.columns.forEach(col => {
      while (col.length < count) col.push(null);
    });

    emptyIndex = cls.columns[columnIndex].findIndex(slot => slot === null);
  }

  cls.columns[columnIndex][emptyIndex] = { nameId, struck: false };
  cls.movingNameId = null;

  showMessage("تم نقل " + name.text + " إلى العمود " + (columnIndex + 1) + " 🎉");
  save();
  render();
}

function moveMovingToSlot(columnIndex, rowIndex, isTempSlot) {
  const cls = getCurrentClass();
  if (!cls || !cls.movingNameId) return;

  const nameId = cls.movingNameId;
  const name = cls.names.find(n => n.id === nameId);

  const oldLocation = findNameLocation(nameId);
  const targetSlot = isTempSlot ? null : cls.columns[columnIndex][rowIndex];

  if (oldLocation && oldLocation.c === columnIndex && oldLocation.r === rowIndex) {
    cls.movingNameId = null;
    showMessage("تم إلغاء نقل " + name.text);
    save();
    render();
    return;
  }

  if (oldLocation) cls.columns[oldLocation.c][oldLocation.r] = null;

  if (targetSlot) {
    const otherNameId = targetSlot.nameId;
    const otherStruck = targetSlot.struck;

    if (oldLocation) {
      cls.columns[oldLocation.c][oldLocation.r] = {
        nameId: otherNameId,
        struck: otherStruck
      };
    }
  }

  if (isTempSlot) {
    cls.extraSlots++;
    const count = 2 + cls.extraSlots;

    cls.columns.forEach(col => {
      while (col.length < count) col.push(null);
    });
  }

  cls.columns[columnIndex][rowIndex] = { nameId, struck: false };
  cls.movingNameId = null;

  showMessage("تم نقل " + name.text + " بنجاح 🎉");
  save();
  render();
}

function cycleSlotState(columnIndex, slotIndex, slotElement) {
  const cls = getCurrentClass();
  if (!cls) return;

  const slot = cls.columns[columnIndex][slotIndex];
  if (!slot) return;

  const name = cls.names.find(n => n.id === slot.nameId);
  if (!name) return;

  if (cls.movingNameId) {
    if (cls.movingNameId === name.id) {
      cls.movingNameId = null;
      showMessage("تم إلغاء وضع النقل.");
      save();
      render();
    }
    return;
  }

  if (cls.selectedNameIds.length > 0) {
    placeSingleSelected(columnIndex, slotIndex, false);
    return;
  }

  if (name.hasStar) {
    name.hasStar = false;
    slot.struck = false;

    const star = slotElement.querySelector(".star");
    if (star) {
      star.classList.add("removing");
      setTimeout(() => { save(); render(); }, 430);
    } else {
      save();
      render();
    }

    showMessage("تم إزالة النجمة من " + name.text + " ⭐");
    return;
  }

  if (!slot.struck) {
    slot.struck = true;
    showMessage(name.text + " تم شطبه ❌");
    save();
    render();
    return;
  }

  slot.struck = false;
  showMessage(name.text + " عاد بدون نجمة 🌟");
  save();
  render();
}

function getDisplayName(cls, nameId) {
  const name = cls.names.find(n => n.id === nameId);
  if (!name) return "";

  const parts = name.text.split(/\s+/).filter(p => p.length > 0);
  if (parts.length === 0) return "";

  const firstName = parts[0];

  const sameFirst = cls.names.filter(n => {
    const p = n.text.split(/\s+/).filter(p => p.length > 0);
    return p.length > 0 && p[0] === firstName;
  });

  if (sameFirst.length <= 1) return firstName;

  if (parts.length >= 2) {
    const twoParts = parts[0] + " " + parts[1];

    const sameTwo = sameFirst.filter(n => {
      const p = n.text.split(/\s+/).filter(p => p.length > 0);
      return p.length >= 2 && (p[0] + " " + p[1]) === twoParts;
    });

    if (sameTwo.length <= 1) return twoParts;

    if (parts.length >= 3) {
      return parts[0] + " " + parts[1] + " " + parts[2];
    }
  }

  return firstName;
}

function newDay() {
  const cls = getCurrentClass();
  if (!cls) return;

  cls.names.forEach(name => name.hasStar = true);

  cls.columns.forEach(column => {
    column.forEach(slot => {
      if (slot) slot.struck = false;
    });
  });

  cls.selectedNameIds = [];
  cls.movingNameId = null;
  showMessage("بداية يوم جديد في فصل: " + cls.name + " 🌟");
  save();
  render();
}

function attachSlotEvents(slot, columnIndex, rowIndex, isTempSlot, nameId) {
  let pressTimer = null;
  let pressed = false;

  slot.addEventListener("pointerdown", function () {
    if (!nameId) return;

    pressed = true;
    pressTimer = setTimeout(() => {
      if (pressed) startMoving(nameId);
    }, 500);
  });

  slot.addEventListener("pointerup", function () {
    clearTimeout(pressTimer);

    if (!pressed) return;
    pressed = false;

    const cls = getCurrentClass();
    if (!cls) return;

    if (cls.movingNameId) {
      if (nameId) {
        moveMovingToSlot(columnIndex, rowIndex, false);
      } else {
        moveMovingToSlot(columnIndex, rowIndex, isTempSlot);
      }
      return;
    }

    if (cls.selectedNameIds.length > 0) {
      if (!nameId && cls.selectedNameIds.length === 1) {
        placeSingleSelected(columnIndex, rowIndex, isTempSlot);
      }
      return;
    }

    if (nameId) {
      cycleSlotState(columnIndex, rowIndex, slot);
    }
  });

  slot.addEventListener("pointercancel", function () {
    clearTimeout(pressTimer);
    pressed = false;
  });

  slot.addEventListener("click", function (event) {
    event.stopPropagation();
  });
}

function render() {
  updateScreens();

  const cls = getCurrentClass();
  if (!cls) return;

  deleteStudentBtn.classList.toggle("active", cls.deleteStudentMode);
  returnBtn.classList.toggle("show", cls.movingNameId !== null);

  // شريط الفصول
  groupsList.innerHTML = "";

  state.classes.forEach(c => {
    const chip = document.createElement("div");
    chip.className = "group-chip" +
      (c.id === state.currentClassId ? " active" : "") +
      (c.id === state.reorderClassId ? " reorder-mode" : "");

    chip.textContent = c.name;

    if (state.classActionsId === c.id) {
      const actions = document.createElement("div");
      actions.className = "chip-actions";

      const editBtn = document.createElement("div");
      editBtn.className = "chip-btn";
      editBtn.textContent = "✏️";
      editBtn.title = "تعديل اسم الفصل";
      editBtn.addEventListener("click", (event) => renameClass(c.id, event));

      const swapBtn = document.createElement("div");
      swapBtn.className = "chip-btn";
      swapBtn.textContent = "⇄";
      swapBtn.title = "تبديل مكان الفصل";
      swapBtn.addEventListener("click", (event) => startReorder(c.id, event));

      const deleteBtn = document.createElement("div");
      deleteBtn.className = "chip-btn delete";
      deleteBtn.textContent = "🗑️";
      deleteBtn.title = "حذف الفصل";
      deleteBtn.addEventListener("click", (event) => deleteClass(c.id, event));

      actions.appendChild(editBtn);
      actions.appendChild(swapBtn);
      actions.appendChild(deleteBtn);
      chip.appendChild(actions);
    }

    let pressTimer = null;
    let longPressed = false;

    chip.addEventListener("pointerdown", function () {
      longPressed = false;

      pressTimer = setTimeout(() => {
        longPressed = true;
        startClassActions(c.id);
      }, 500);
    });

    chip.addEventListener("pointerup", function () {
      clearTimeout(pressTimer);
    });

    chip.addEventListener("pointercancel", function () {
      clearTimeout(pressTimer);
      longPressed = false;
    });

    chip.addEventListener("click", function (event) {
      event.stopPropagation();

      if (longPressed) {
        longPressed = false;
        return;
      }

      state.classActionsId = null;
      switchClass(c.id);
    });

    groupsList.appendChild(chip);
  });

  const count = 2 + cls.extraSlots;
  cls.columns.forEach(column => {
    while (column.length < count) column.push(null);
  });

  // الأسماء المتاحة
  namesList.innerHTML = "";

  const availableNames = cls.names.filter(name => findNameLocation(name.id) === null);

  if (availableNames.length === 0) {
    const empty = document.createElement("div");
    empty.style.color = "#90a4ae";
    empty.style.fontWeight = "bold";
    empty.textContent = "أضف أسماء الطلاب من الأعلى ➕";
    namesList.appendChild(empty);
  }

  availableNames.forEach(name => {
    const order = cls.selectedNameIds.indexOf(name.id);
    const displayName = getDisplayName(cls, name.id);

    const chip = document.createElement("div");
    chip.className = "name-chip" +
      (order !== -1 ? " selected" : "") +
      (cls.deleteStudentMode ? " delete-mode" : "");

    chip.textContent = displayName;

    if (order !== -1) {
      const badge = document.createElement("div");
      badge.className = "order-badge";
      badge.textContent = order + 1;
      chip.appendChild(badge);
    }

    if (cls.deleteStudentMode) {
      const x = document.createElement("div");
      x.className = "delete-x";
      x.textContent = "✕";
      x.addEventListener("click", (event) => deleteName(name.id, event));
      chip.appendChild(x);
    }

    chip.addEventListener("click", () => toggleSelectName(name.id));
    namesList.appendChild(chip);
  });

  // الأعمدة
  board.innerHTML = "";

  const lastColumnIndex = cls.columns.length - 1;
  const hasSelection = cls.selectedNameIds.length > 0;
  const permanentCount = 2 + cls.extraSlots;
  const totalSlots = hasSelection ? permanentCount + 1 : permanentCount;

  cls.columns.forEach((column, c) => {
    const columnDiv = document.createElement("div");
    columnDiv.className = "column";
    columnDiv.dataset.column = c;

    const title = document.createElement("div");
    title.className = "column-title" +
      ((hasSelection || cls.movingNameId) ? " active-mode" : "");

    title.textContent = cls.movingNameId
      ? "عمود " + (c + 1) + " 👆"
      : "عمود " + (c + 1);

    title.addEventListener("click", function (event) {
      event.stopPropagation();
      placeSelectedNamesInColumn(c);
    });

    columnDiv.appendChild(title);

    if (c === lastColumnIndex) {
      const deleteBtn = document.createElement("div");
      deleteBtn.className = "column-delete";
      deleteBtn.textContent = "✕";
      deleteBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        deleteLastColumn();
      });
      columnDiv.appendChild(deleteBtn);
    }

    for (let r = 0; r < totalSlots; r++) {
      const isTempSlot = hasSelection && r === permanentCount;
      const slotData = isTempSlot ? null : (column[r] || null);

      const slot = document.createElement("div");
      slot.className = "slot";
      slot.dataset.column = c;
      slot.dataset.row = r;

      if (slotData) {
        const name = cls.names.find(n => n.id === slotData.nameId);
        const displayName = getDisplayName(cls, name.id);

        slot.classList.add("filled", "selectable");

        if (cls.movingNameId === slotData.nameId) {
          slot.classList.add("moving");
          slot.innerHTML = displayName + '<span class="move-hint">👆 انقلني</span>';
        } else if (slotData.struck) {
          slot.classList.add("struck");
          slot.innerHTML = displayName + '<span class="error-x">❌</span>';
        } else if (name.hasStar) {
          slot.innerHTML = displayName + '<span class="star">⭐</span>';
        } else {
          slot.classList.add("no-star");
          slot.textContent = displayName;
        }

        attachSlotEvents(slot, c, r, false, slotData.nameId);
      } else {
        slot.classList.add("selectable");
        slot.textContent = "•";

        if (isTempSlot) slot.classList.add("temp-slot");

        attachSlotEvents(slot, c, r, isTempSlot, null);
      }

      columnDiv.appendChild(slot);
    }

    board.appendChild(columnDiv);
  });
}

nameInput.addEventListener("keydown", function (event) {
  if (event.key === "Enter") addName();
});

let startHandled = false;

function handleStart(event) {
  if (startHandled) return;
  startHandled = true;

  event.preventDefault();
  startFromSetup();

  setTimeout(() => {
    startHandled = false;
  }, 300);
}

startBtn.addEventListener("touchend", handleStart, { passive: false });
startBtn.addEventListener("click", handleStart);

window.addEventListener("load", load);
</script>
